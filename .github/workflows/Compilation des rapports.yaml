name: Generate PDF Report

on:
  push:
    branches:
      - main

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installer Quarto et TinyTeX (LaTeX)
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true  # Installer TinyTeX pour générer des PDFs

      # Installer R et les dépendances nécessaires pour Quarto
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          install.packages(c("quarto", "rmarkdown", "knitr", "yaml", "ggplot2"))

      # Compiler les fichiers Rmd en PDF
      - name: Render Rapport and Main Rmd to PDF
        run: |
          Rscript -e 'rmarkdown::render("scripts/Rapport.Rmd", output_format = "pdf_document")'
          Rscript -e 'rmarkdown::render("main.Rmd", output_format = "pdf_document")'

      # Télécharger le PDF généré en tant qu'artifact
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4.1.0
        with:
          name: rapport.pdf
          path: rapport.pdf
