name: Exécution des rapports R

on:
  push:
    branches:
      - main  # Exécuter le workflow chaque fois qu'il y a un push dans la branche 'main'

jobs:
  run-reports:
    runs-on: ubuntu-latest  # Utilisation d'un environnement Ubuntu pour exécuter le script R

    steps:
      # Étape 1 : Vérifier le dépôt
      - name: Check out the repository
        uses: actions/checkout@v3

      # Étape 2 : Installer R et les dépendances nécessaires
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # Étape 3 : Installer les packages nécessaires
      - name: Install R packages
        run: |
          # Installer les packages nécessaires pour le script
          Rscript -e "install.packages('here', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('rmarkdown', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('yaml', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('ggplot2', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('grid', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('gridExtra', repos='https://cloud.r-project.org')"

      # Étape 4 : Exécuter le script R 'Execution des rapports.R'
      - name: Run the R script to generate reports
        run: |
          # Assure-toi que le chemin est correct, par exemple scripts/Execution_des_rapports.R
          Rscript scripts/Execution_des_rapports.R  

      # Étape 5 : Ajouter l'artefact (les fichiers générés comme les rapports HTML, Word, etc.)
      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4.1.0
        with:
          name: reports
          path: rapport/  # Spécifie le dossier où les rapports HTML, Word, etc. sont générés
