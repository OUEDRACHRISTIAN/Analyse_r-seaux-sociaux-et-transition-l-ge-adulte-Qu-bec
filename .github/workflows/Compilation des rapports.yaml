name: Export RMarkdown to HTML

on:
  push:
    branches:
      - main  # ou la branche de ton choix

jobs:
  generate-html:
    permissions:
      contents: write  # Permet de pousser dans le dépôt
    runs-on: ubuntu-latest  # Utilise un environnement Ubuntu pour l'exécution

    steps:
      # 1. Vérifier le dépôt
      - name: Check out repository
        uses: actions/checkout@v3

      # 2. Installer R et les dépendances nécessaires
      - name: Install R
        uses: r-lib/actions/setup-r@v2

      # 3. Installer les packages nécessaires (RMarkdown, knitr, ggplot2, etc.)
      - name: Install required R packages
        run: |
          Rscript -e "install.packages(c('rmarkdown', 'knitr', 'ggplot2', 'downlit', 'xml2', 'gt', 'tidyverse'))"

      # 4. Rendre le fichier RMarkdown en HTML
      - name: Render RMarkdown to HTML
        run: |
          Rscript -e "rmarkdown::render('rapport.Rmd', output_format = 'html_document')"

      # 5. Déplacer le fichier HTML généré dans le dossier 'rapport' 
      - name: Move HTML to rapport folder
        run: |
          mkdir -p rapport  # Crée le dossier 'rapport' s'il n'existe pas
          mv rapport.html rapport/  # Déplace le fichier HTML généré dans le dossier 'rapport'

      # 6. Télécharger l'artefact (fichier HTML) généré
      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4.1.0
        with:
          name: rapport.html
          path: rapport/rapport.html  # Chemin vers le fichier HTML dans le dossier 'rapport'

      # 7. Commit et push du fichier HTML généré
      - name: Commit and Push Results
        run: |
          git config --local user.email "ouedraogocyriaque1@gmail.com"
          git config --local user.name "ChristianCyriaque"
          git add rapport/rapport.html
          git commit -m 'Rapport HTML généré et mis à jour' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
