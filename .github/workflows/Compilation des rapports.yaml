name: Compile RMarkdown to Word

on:
  push:
    branches:
      - main

jobs:
  generate-docs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::officer
            any::flextable
            any::tidyverse

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render main.Rmd to Word
        run: Rscript -e 'rmarkdown::render("main.Rmd", output_format="word_document", output_file="rapport/main.docx")'

      - name: Render rapport.Rmd to Word
        run: Rscript -e 'rmarkdown::render("scripts/rapport.Rmd", output_format="word_document", output_file="rapport/rapport.docx")'

      - name: Commit and Push results
        run: |
          git config --local user.email "ouedraogocyriaque1@gmail.com"
          git config --local user.name "ChristianCyriaque"
          git add rapport/main.docx rapport/rapport.docx
          git commit -m "Generated Word reports" || echo "No changes to commit"
          git push origin || echo "No changes to commit"
