name: Compile RMarkdown to Word

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Check out the repository
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Set up R (install R and dependencies)
      - name: Install R
        uses: r-lib/actions/setup-r@v2

      # 3. Install system dependencies (including Quarto)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
          wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.7.0/quarto-1.7.0-linux-amd64.deb
          sudo dpkg -i quarto-1.7.0-linux-amd64.deb

      # 4. Install and initialize renv environment
      - name: Install R packages and initialize renv
        run: |
          Rscript -e "install.packages('renv')"
          Rscript -e "renv::init()"
          Rscript -e "renv::install(c('rmarkdown', 'ggplot2', 'yaml', 'officer', 'flextable', 'tidyverse'))"
        
      # 5. Restore dependencies with renv (to ensure the environment is consistent)
      - name: Restore dependencies using renv
        run: |
          Rscript -e "renv::restore()"

      # 6. Render the RMarkdown files to Word
      - name: Render RMarkdown file to Word
        run: |
          Rscript -e 'rmarkdown::render("main.Rmd", output_format="word_document", output_file="rapport/main.docx")'
          Rscript -e 'rmarkdown::render("scripts/rapport.Rmd", output_format="word_document", output_file="rapport/rapport.docx")'

      # 7. Commit and push the results if any files were generated
      - name: Commit and Push results
        run: |
          git config --local user.email "your-email@example.com"
          git config --local user.name "Your Name"
          git add rapport/main.docx rapport/rapport.docx
          git commit -m "Generated Word reports" || echo "No changes to commit"
          git push origin || echo "No changes to commit"
