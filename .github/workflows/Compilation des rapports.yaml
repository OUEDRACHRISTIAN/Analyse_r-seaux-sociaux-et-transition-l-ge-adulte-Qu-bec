name: Compile and Export Report

on:
  push:
    branches:
      - main  # Exécution sur push sur la branche principale

jobs:
  compile-report:
    permissions:
      contents: write  # Permissions pour écrire dans le dépôt
    runs-on: ubuntu-latest
    steps:
      # Étape 1: Vérifier le dépôt
      - name: Check out repository
        uses: actions/checkout@v3
        
      # Étape 2: Installer R
      - name: Install R
        uses: r-lib/actions/setup-r@v2

      # Étape 3: Installer les dépendances R nécessaires
      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::gt
            any::tidyverse

      # Étape 4: Configurer Quarto (si tu utilises Quarto pour compiler le fichier)
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true  # Installer TinyTeX pour générer des fichiers PDF via LaTeX

      # Étape 5: Compiler le fichier Quarto (ou RMarkdown) en PDF
      - name: Render Quarto Project to PDF
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: pdf
          path: rapport/rapport.Rmd  # Le chemin vers ton fichier .Rmd dans le dossier 'rapport'

      # Étape 6: Déplacer le PDF généré dans le dossier 'rapport'
      - name: Move PDF to rapport folder
        run: |
          mkdir -p rapport  # Créer le dossier 'rapport' s'il n'existe pas
          mv rapport.pdf rapport/  # Déplacer le fichier PDF dans le dossier 'rapport'

      # Étape 7: Télécharger le fichier PDF généré en tant qu'artifact
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4.1.0
        with:
          name: rapport.pdf
          path: rapport/rapport.pdf  # Chemin vers le fichier PDF dans le dossier 'rapport'
