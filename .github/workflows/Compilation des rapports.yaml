name: Export HTML Report After Push

on:
  push:
    branches:
      - main  # Remplacer par la branche sur laquelle tu souhaites que ce workflow soit exécuté

jobs:
  generate-html:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Étape 1: Vérifier le dépôt
      - name: Check out repository
        uses: actions/checkout@v3

      # Étape 2: Installer R
      - name: Install R
        uses: r-lib/actions/setup-r@v2

      # Étape 3: Installer `renv` et restaurer les dépendances du projet
      - name: Install renv and restore dependencies
        run: |
          Rscript -e "install.packages('renv')"  # Installer renv
          Rscript -e "renv::restore()"  # Restaurer les dépendances à partir du fichier renv.lock

      # Étape 4: Installer les packages nécessaires (yaml, ggplot2, etc.)
      - name: Install required R packages
        run: |
          Rscript -e "install.packages(c('yaml', 'ggplot2', 'knitr', 'rmarkdown', 'downlit', 'xml2', 'gt', 'tidyverse'))"

      # Étape 5: Configurer Quarto
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true  # Installer TinyTeX pour la gestion de la génération HTML et PDF

      # Étape 6: Générer le fichier HTML à partir du fichier Quarto (ou RMarkdown)
      - name: Render Quarto Project to HTML
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html  # Remplacer pdf par html
          path: rapport.Rmd  # Le chemin vers ton fichier .Rmd

      # Étape 7: Déplacer le fichier HTML généré dans le dossier 'rapport'
      - name: Move HTML to rapport folder
        run: |
          mkdir -p rapport  # Créer le dossier 'rapport' s'il n'existe pas
          mv rapport.html rapport/  # Déplacer le fichier HTML dans le dossier 'rapport'

      # Étape 8: Télécharger le fichier HTML généré en tant qu'artefact
      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4.1.0
        with:
          name: rapport.html
          path: rapport/rapport.html  # Chemin vers le fichier HTML dans le dossier 'rapport'

      # Étape 9: Commiter et pousser les résultats (le fichier HTML généré)
      - name: Commit results
        run: |
          git config --local user.email "ouedraogocyriaque1@gmail.com"
          git config --local user.name "ChristianCyriaque"
          git add rapport/rapport.html
          git commit -m 'Rapport HTML généré et mis à jour' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
