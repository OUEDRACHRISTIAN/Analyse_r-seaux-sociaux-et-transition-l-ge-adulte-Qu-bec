name: Compile Quarto Documents to Word

on:
  push:
    branches:
      - main

jobs:
  generate-docs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Quarto
        run: |
          wget https://github.com/quarto-dev/quarto-cli/releases/download/v1.0.0/quarto-1.0.0-linux-amd64.deb
          sudo dpkg -i quarto-1.0.0-linux-amd64.deb
          quarto --version

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install necessary R packages
        run: |
          install.packages("ggplot2")
          install.packages("knitr")
          install.packages("rmarkdown")
          install.packages("officer")
          install.packages("flextable")
          install.packages("tidyverse")

      - name: Render main.Rmd to Word using Quarto
        run: |
          quarto render main.Rmd --to docx --output rapport/main.docx

      - name: Render rapport.Rmd to Word using Quarto
        run: |
          quarto render scripts/rapport.Rmd --to docx --output rapport/rapport.docx

      - name: Commit and Push results
        run: |
          git config --local user.email "ouedraogocyriaque1@gmail.com"
          git config --local user.name "ChristianCyriaque"
          git add rapport/main.docx rapport/rapport.docx
          git commit -m "Generated Word reports" || echo "No changes to commit"
          git push origin || echo "No changes to commit"
