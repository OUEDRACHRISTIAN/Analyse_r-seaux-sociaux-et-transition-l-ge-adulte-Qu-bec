name: Generate PDF Report

on:
  push:
    branches:
      - main

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installe Quarto et LaTeX
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Installer les dépendances nécessaires
      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install Quarto dependencies
        run: |
          sudo apt-get install -y pandoc
          Rscript -e "install.packages('quarto')"

      # Compiler les fichiers en PDF
      - name: Render Rapport and Main Rmd
        run: |
          Rscript -e 'quarto::quarto_render("scripts/Rapport.Rmd", output_format = "pdf_document")'
          Rscript -e 'quarto::quarto_render("main.Rmd", output_format = "pdf_document")'

      # Télécharger le PDF généré
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4.1.0
        with:
          name: rapport.pdf
          path: rapport.pdf
