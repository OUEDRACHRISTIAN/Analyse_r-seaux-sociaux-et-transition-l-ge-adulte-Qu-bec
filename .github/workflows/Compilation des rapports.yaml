name: Export HTML Report After Push

on:
  push:
    branches:
      - main  # Remplace par la branche que tu souhaites surveiller

jobs:
  generate-html:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Étape 1: Vérifier le dépôt
      - name: Check out repository
        uses: actions/checkout@v3

      # Étape 2: Installer R
      - name: Install R
        uses: r-lib/actions/setup-r@v2

      # Étape 3: Installer les packages nécessaires (rmarkdown, ggplot2, etc.)
      - name: Install required R packages
        run: |
          Rscript -e "install.packages(c('rmarkdown', 'ggplot2', 'tidyverse'))"

      # Étape 4: Compiler le fichier Rmd en HTML
      - name: Render Rmd to HTML
        run: |
          Rscript -e "rmarkdown::render('rapport.Rmd', output_format = 'html_document')"

      # Étape 5: Déplacer le fichier HTML généré dans le dossier 'rapport'
      - name: Move HTML to rapport folder
        run: |
          mkdir -p rapport
          mv rapport.html rapport/  # Déplacer le fichier HTML dans le dossier 'rapport'

      # Étape 6: Télécharger le fichier HTML généré en tant qu'artefact
      - name: Upload HTML Artifact
        uses: actions/upload-artifact@v4.1.0
        with:
          name: rapport.html
          path: rapport/rapport.html

      # Étape 7: Commit et push les résultats
      - name: Commit results
        run: |
          git config --local user.email "ouedraogocyriaque1@gmail.com"
          git config --local user.name "ChristianCyriaque"
          git add rapport/rapport.html
          git commit -m 'Rapport HTML généré et mis à jour' || echo "No changes to commit"
          git push origin || echo "No changes to commit"
